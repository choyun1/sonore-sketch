name: try-snapshot (temporary)

on:
  push:
    branches: [claude/warm-load-n28lt5]

jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Try the snapshot
        run: python tools/try_snapshot.py --repeats 2
