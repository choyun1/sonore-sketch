name: measure-load (temporary)

on:
  push:
    branches: [claude/warm-load-n28lt5]

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Before (main)
        run: |
          git worktree add ../main origin/main
          cp tools/measure_load.py ../main/tools/
          cd ../main && python tools/measure_load.py --visits 4
      - name: After (this branch)
        run: python tools/measure_load.py --visits 4
      - name: Live site
        run: python tools/measure_load.py --url https://choyun1.github.io/sonore-sketch/ --visits 3
