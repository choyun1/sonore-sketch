<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sonore-sketch</title>
  <meta name="description" content="Draw on a picture of sound and hear the result, with sonore.">
  <link rel="icon" href="app/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app/style.css">
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <header class="bar">
    <h1><img class="logo" src="app/logo.svg" alt="">sonore-sketch</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" class="active" aria-selected="true" data-tab="tracks"
        data-caption="Draw formant, pitch and voicing tracks over time, and hear Klatt's synthesizer speak them (after TrackDraw; Assmann et al., 1994)."
        title="Formant, F0 and amplitude tracks, synthesized by Klatt's synthesizer">Draw speech</button>
      <button role="tab" aria-selected="false" data-tab="painted"
        data-caption="Paint loudness over time and frequency, and hear a sound whose spectrogram is your painting."
        title="Level painted on time × log-frequency, heard through sonore's ripple_sound">Paint spectrogram</button>
      <button role="tab" aria-selected="false" data-tab="mask"
        data-caption="Take a sound (a syllable train, the Draw speech tab's sound, or a recording), erase parts of its spectrogram (a band, a moment, a harmonic) and hear what is left."
        title="A mask painted on a sound's spectrogram, heard through sonore's least-squares STFT resynthesis (GaborFrame)">Erase spectrogram</button>
      <button role="tab" aria-selected="false" data-tab="blobs"
        data-caption="Place blobs on a modulation spectrum (how fast loudness changes in time and across frequency) and hear a sound with that rhythm and texture."
        title="Gaussian blobs on rate × density, heard through sonore's ModulationSpectrum.from_blobs">Draw modulation</button>
      <button role="tab" aria-selected="false" data-tab="edit"
        data-caption="Take a sound and erase parts of its modulation spectrum: remove every rate above 4 Hz from speech and it blurs into a murmur that keeps its rhythm."
        title="Parts of a sound's modulation spectrum painted out, heard through sonore's ModulationSpectrum.with_gain and to_sound">Erase modulation</button>
    </nav>
    <div class="controls">
      <button type="button" id="play" class="primary" title="Play or stop (Space)" disabled>Loading…</button>
      <label class="duration" title="Length of the sound, up to 10 s. Changing it stretches what is drawn.">
        <input type="number" id="duration" min="0.05" max="10" step="0.05" value="0.6"> s
      </label>
      <label class="check" title="Hear each change as soon as it is drawn (sounds up to 3 s)"><input type="checkbox" id="autoplay"> Auto-play</label>
      <button type="button" id="reset" title="Start this tab again from its default drawing, at the default duration (Undo brings yours back)">Reset</button>
      <button type="button" id="undo" title="Undo (Ctrl+Z)">↶</button>
      <button type="button" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button type="button" id="open" title="Open a saved drawing (.json)">Open</button>
      <button type="button" id="save" title="Save the drawing as JSON">Save</button>
      <button type="button" id="link" title="Copy a link that opens this drawing">Link</button>
      <button type="button" id="wav" title="Save the sound as a WAV file" disabled>WAV</button>
      <button type="button" id="log-toggle" title="Show what the page did and any errors" aria-expanded="false">Log</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
      <a class="about" href="https://github.com/choyun1/sonore-sketch#readme" target="_blank" rel="noopener" title="What this page is and how each tab works, on GitHub">About ↗</a>
    </div>
  </header>
  <div class="loading" id="loading">
    <div class="loading-text">
      <strong id="loading-step">Starting…</strong>
      <span id="loading-time"></span>
      <span class="loading-note">Python and sonore run in your browser, so the first visit takes a little while. Play turns on when they are ready.</span>
    </div>
    <div class="loading-bar"><div></div></div>
  </div>
  <main>
    <p class="tab-caption" id="tab-caption"></p>
    <section class="tab-body" id="tab-tracks"></section>
    <section class="tab-body" id="tab-painted" hidden></section>
    <section class="tab-body" id="tab-mask" hidden></section>
    <section class="tab-body" id="tab-blobs" hidden></section>
    <section class="tab-body" id="tab-edit" hidden></section>
    <section class="result">
      <div class="result-row">
        <span class="result-label">Result</span>
        <canvas id="waveform"></canvas>
      </div>
    </section>
    <section class="log" id="log" hidden>
      <div class="log-head">
        <strong>Log</strong>
        <span class="log-note">Errors and what the page did. Copy includes the versions and the current drawing, for a bug report.</span>
        <button type="button" id="log-copy">Copy</button>
        <button type="button" id="log-clear">Clear</button>
      </div>
      <pre id="log-lines"></pre>
    </section>
  </main>
  <footer class="status">
    <span id="status" role="status">Starting…</span>
    <span id="versions"></span>
  </footer>
</body>
</html>
