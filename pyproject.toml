[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonore-sketch"
version = "0.1.0.dev0"
description = "Draw on a picture of sound and hear the result: a drawing front end for sonore."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adrian Y. Cho" }, { name = "Daniel R Guest" }]
requires-python = ">=3.10"
# The page installs exactly this sonore under Pyodide (app/worker.js,
# SONORE_VERSION); keep the two in step (docs/design/app.md, D5).
dependencies = ["sonore>=0.6,<0.7"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
